<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boots Ockel</title>
  <meta name="description" content="A celebration of Boots Ockel.">
  <meta property="og:title" content="Boots Ockel">
  <meta property="og:image" content="https://bootsockel.com/img/full/20260915-102959.jpg">
  <link rel="preload" href="fonts/shrikhand.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/site.css">
  <style>:root { --pet: #7ed9a6; --pet-soft: #dcf5e7; --pet-deep: #10211a; }</style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div>
        <p class="eyebrow">A celebration of</p>
        <h1 class="name">Boots Ockel</h1>
        <ul class="nav">
          <li><a href="https://frankockel.com">Meet the whole crew</a></li>
        </ul>
      </div>
      <figure class="snap">
        <a href="img/full/20260915-102959.jpg" data-full data-caption="Boots"><img src="img/full/20260915-102959.jpg" alt="Boots" width="2000" height="1500"></a>
      </figure>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="section">
        <div class="section-head">
          <h2>The good times</h2>
        </div>
        <ul class="gallery">
          {{ITEMS}}
        </ul>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>The rest of the crew</h2>
        </div>
        <ul class="friends tilts">
          <li class="friend" style="--friend: #ffc53d"><a class="friend-link" href="https://charlieockel.com"><figure class="snap"><img src="friends/charlie.jpg" alt="Charlie"><figcaption>Charlie</figcaption></figure></a></li>
          <li class="friend" style="--friend: #7cc6fe"><a class="friend-link" href="https://baxterfrank.com"><figure class="snap"><img src="friends/baxter.jpg" alt="Baxter"><figcaption>Baxter</figcaption></figure></a></li>
          <li class="friend" style="--friend: #ccccff"><a class="friend-link" href="https://archietherat.com"><figure class="snap"><img src="friends/archie.jpg" alt="Archie the rat"><figcaption>Archie the Rat</figcaption></figure></a></li>
        </ul>
      </section>
    </div>
  </main>

  <footer class="site-foot">
    <div class="wrap">
      <p class="paws">Thanks for the good times, Boots.</p>
      <p>Part of <a href="https://frankockel.com">the Frank–Ockel family pets</a>.</p>
    </div>
  </footer>
  <script src="js/gallery.js" defer></script>
</body>
</html>
